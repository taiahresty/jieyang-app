<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>捷暘企業 - 管理系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); }
    .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24 antialiased selection:bg-blue-500 selection:text-white select-none">

  <!-- 頂部導覽列 -->
  <header class="glass-nav text-white px-4 py-3.5 sticky top-0 z-40 border-b border-slate-800/80 shadow-sm flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/20">
        <i class="fa-solid fa-cube text-base"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight" id="txt-app-title">捷暘企業管理系統</h1>
        <div class="text-[11px] text-slate-400 font-medium flex items-center gap-1.5" id="user-display">
          <span>系統載入中...</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleLanguage()" class="bg-slate-800/90 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 font-semibold" id="lang-btn">
        <i class="fa-solid fa-earth-americas text-[11px]"></i>
        <span>Tiếng Việt</span>
      </button>
      <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-1.5 text-xs transition">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- 登入卡片 (未登入時顯示) -->
  <div id="view-login" class="p-6 max-w-sm mx-auto mt-12">
    <div class="bg-white p-7 rounded-3xl card-shadow border border-slate-200/80 text-center space-y-5">
      <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-slate-900">企業身分驗證</h2>
        <p class="text-xs text-slate-500 mt-1">請使用公司已登記之 Google 帳號授權登入</p>
      </div>

      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-2xl font-semibold text-xs tracking-wide shadow-md active:scale-98 transition">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4">
        <span>使用 Google 帳號安全登入</span>
      </button>

      <div id="login-error" class="text-xs text-rose-500 bg-rose-50 border border-rose-200 p-3 rounded-xl hidden font-medium text-left"></div>
    </div>
  </div>

  <!-- 主內容視圖 -->
  <main id="main-content" class="hidden p-4 max-w-md mx-auto space-y-4">

    <!-- 推播通知啟用橫幅 -->
    <div id="push-notice-banner" class="bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-200/80 p-3.5 rounded-2xl flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs shadow-sm">
          <i class="fa-solid fa-bell"></i>
        </div>
        <div class="text-xs text-amber-900">
          <div class="font-bold">尚未啟用手機推播</div>
          <div class="text-[11px] text-amber-700">點擊啟用以接收工單響鈴</div>
        </div>
      </div>
      <button onclick="requestPushPermissionManually()" class="bg-amber-600 hover:bg-amber-700 active:scale-95 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm">
        啟用
      </button>
    </div>

    <!-- 頁籤一：交辦事項清單 -->
    <div id="tab-tasks" class="space-y-3">
      <!-- 統計儀表板小卡 -->
      <div class="grid grid-cols-3 gap-2.5" id="stats-container">
        <div class="bg-white p-3 rounded-2xl card-shadow border border-slate-200/60 flex flex-col items-center">
          <span class="text-[11px] text-slate-400 font-medium">總工單</span>
          <span class="text-lg font-bold text-slate-800 mt-0.5" id="stat-total">0</span>
        </div>
        <div class="bg-white p-3 rounded-2xl card-shadow border border-slate-200/60 flex flex-col items-center">
          <span class="text-[11px] text-blue-500 font-medium">進行中</span>
          <span class="text-lg font-bold text-blue-600 mt-0.5" id="stat-pending">0</span>
        </div>
        <div class="bg-white p-3 rounded-2xl card-shadow border border-slate-200/60 flex flex-col items-center">
          <span class="text-[11px] text-emerald-500 font-medium">已完成</span>
          <span class="text-lg font-bold text-emerald-600 mt-0.5" id="stat-completed">0</span>
        </div>
      </div>

      <div class="flex justify-between items-center pt-1 px-1">
        <h2 class="font-bold text-slate-900 text-sm flex items-center gap-1.5" id="txt-tasks-title">
          <i class="fa-solid fa-list-check text-blue-600"></i>
          <span>工作交辦清單</span>
        </h2>
        <button onclick="loadTasks()" class="text-xs text-slate-500 hover:text-blue-600 flex items-center gap-1 font-semibold py-1 px-2 rounded-lg active:bg-slate-200/60 transition">
          <i class="fa-solid fa-rotate-right text-[11px]"></i>
          <span>重新整理</span>
        </button>
      </div>

      <div id="tasks-container" class="space-y-3"></div>
    </div>

    <!-- 頁籤二：現場作業填報 -->
    <div id="tab-forms" class="hidden space-y-4">
      <div class="px-1">
        <h2 class="font-bold text-slate-900 text-sm flex items-center gap-1.5" id="txt-forms-title">
          <i class="fa-solid fa-bolt-lightning text-amber-500"></i>
          <span>現場作業即時回報</span>
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">點擊下方模組快速拍照填報，將自動歸檔並推播主管</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="openForm('cleaning')" class="bg-white p-4 rounded-2xl card-shadow border border-slate-200/70 hover:border-blue-400 active:scale-97 transition flex flex-col items-center gap-2.5 text-center">
          <div class="w-12 h-12 rounded-2xl bg-cyan-50 text-cyan-600 flex items-center justify-center text-xl shadow-inner">
            <i class="fa-solid fa-soap"></i>
          </div>
          <span class="font-bold text-xs text-slate-800" id="btn-cleaning">集塵板清洗</span>
        </button>

        <button onclick="openForm('sewage')" class="bg-white p-4 rounded-2xl card-shadow border border-slate-200/70 hover:border-blue-400 active:scale-97 transition flex flex-col items-center gap-2.5 text-center">
          <div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center text-xl shadow-inner">
            <i class="fa-solid fa-faucet-drip"></i>
          </div>
          <span class="font-bold text-xs text-slate-800" id="btn-sewage">污水設備操作</span>
        </button>

        <button onclick="openForm('assembly')" class="bg-white p-4 rounded-2xl card-shadow border border-slate-200/70 hover:border-blue-400 active:scale-97 transition flex flex-col items-center gap-2.5 text-center">
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shadow-inner">
            <i class="fa-solid fa-gears"></i>
          </div>
          <span class="font-bold text-xs text-slate-800" id="btn-assembly">靜電機出機組裝</span>
        </button>

        <button onclick="openForm('inventory')" class="bg-white p-4 rounded-2xl card-shadow border border-slate-200/70 hover:border-blue-400 active:scale-97 transition flex flex-col items-center gap-2.5 text-center">
          <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl shadow-inner">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
          <span class="font-bold text-xs text-slate-800" id="btn-inventory">機臺庫存出入庫</span>
        </button>
      </div>

      <!-- 主管發起專屬模組 -->
      <div id="manager-create-box" class="hidden pt-1">
        <button onclick="openForm('createtask')" class="w-full bg-gradient-to-r from-blue-700 to-indigo-700 hover:from-blue-800 hover:to-indigo-800 text-white p-4 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 active:scale-98 transition">
          <i class="fa-solid fa-plus-circle text-sm"></i>
          <span>發起新工作交辦 (主管專用)</span>
        </button>
      </div>
    </div>

    <!-- 頁籤三：客戶保養歷史查詢 -->
    <div id="tab-search" class="hidden space-y-3">
      <div class="px-1">
        <h2 class="font-bold text-slate-900 text-sm flex items-center gap-1.5" id="txt-search-title">
          <i class="fa-solid fa-magnifying-glass text-blue-600"></i>
          <span>客戶保養紀錄查詢</span>
        </h2>
      </div>

      <div class="bg-white p-4 rounded-2xl card-shadow border border-slate-200/70 space-y-3">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-building text-slate-400 absolute left-3 top-3.5 text-xs"></i>
            <input type="text" id="search-cust-id" placeholder="輸入客戶編號 (如 A05233)" class="w-full pl-8 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs uppercase font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="searchMaintenance()" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white px-4 rounded-xl font-bold text-xs transition">
            查詢
          </button>
        </div>
        <div id="search-results" class="space-y-2.5 pt-1"></div>
      </div>
    </div>
  </main>

  <!-- 底部固定導覽列 -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 flex justify-around py-2 z-40 shadow-lg">
    <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-blue-600 font-bold text-[11px] py-1 transition">
      <i class="fa-solid fa-rectangle-list text-base mb-1"></i>
      <span id="txt-nav-tasks">交辦事項</span>
    </button>
    <button onclick="switchTab('forms')" id="nav-forms" class="flex flex-col items-center text-slate-400 font-medium text-[11px] py-1 transition">
      <i class="fa-solid fa-pen-to-square text-base mb-1"></i>
      <span id="txt-nav-forms">現場回報</span>
    </button>
    <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center text-slate-400 font-medium text-[11px] py-1 transition">
      <i class="fa-solid fa-circle-question text-base mb-1"></i>
      <span id="txt-nav-search">保養查詢</span>
    </button>
  </nav>

  <!-- 圖片點擊放大 Modal -->
  <div id="image-lightbox" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onclick="closeLightbox()">
    <img id="lightbox-img" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
  </div>

  <!-- 通用填報 Modal -->
  <div id="form-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md max-h-[90vh] rounded-t-3xl sm:rounded-3xl p-5 overflow-y-auto space-y-4 card-shadow">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="font-bold text-sm text-slate-900">表單填報</h3>
        <button onclick="closeFormModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-sm">&times;</button>
      </div>
      <div id="modal-form-content" class="space-y-3.5"></div>
      <div class="pt-2 flex gap-2.5">
        <button onclick="closeFormModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-xs transition">取消</button>
        <button onclick="submitCurrentForm()" id="btn-submit-form" class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white py-3 rounded-xl font-bold text-xs shadow-md shadow-blue-500/20 transition">確認送出</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdbRUdY3H8LQ_Q3GQeWIvETXzoEg2yfCmrngHUf6_b6xc85kexrw8cGMZIG_JAlH1Otw/exec";
    const VAPID_KEY = "BO7YgR9148-fj_2MIKbsQjHQLWG0ya0UmUeByv8KCj0oYMh20r_e4xgQf5n8QX7X3r1SFiU8TNCXqKsV8zZymBA";

    const firebaseConfig = {
      apiKey: "AIzaSyDopI3s9YpXVVUYdJNUOjDLIMm4riHcC4o",
      authDomain: "jieyang-app.firebaseapp.com",
      projectId: "jieyang-app",
      storageBucket: "jieyang-app.firebasestorage.app",
      messagingSenderId: "1023764652287",
      appId: "1:1023764652287:web:df656d3e5570b7be856cca",
      measurementId: "G-9MZ6EQL0GJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let messaging = null;
    let swRegistration = null;

    const i18n = {
      zh: {
        appTitle: "捷暘企業管理系統", tasks: "工作交辦清單", forms: "現場作業即時回報", search: "客戶保養紀錄查詢",
        cleaning: "集塵板清洗", sewage: "污水設備操作", assembly: "靜電機出機組裝", inventory: "機臺庫存出入庫",
        navTasks: "交辦事項", navForms: "現場回報", navSearch: "保養查詢"
      },
      vi: {
        appTitle: "HỆ THỐNG QUẢN LÝ JY", tasks: "Danh sách công việc", forms: "Báo cáo hiện trường", search: "Tra cứu bảo dưỡng",
        cleaning: "Rửa tấm lọc bụi", sewage: "Vận hành nước thải", assembly: "Lắp ráp máy tĩnh điện", inventory: "Kho máy vào/ra",
        navTasks: "Giao việc", navForms: "Báo cáo", navSearch: "Tra cứu"
      }
    };

    let currentLang = localStorage.getItem("app_lang") || "zh";
    let currentUser = JSON.parse(localStorage.getItem("app_user") || "null");
    let employeeList = [];
    let currentActiveForm = "";

    window.addEventListener("load", async () => {
      applyLanguage();
      if ("serviceWorker" in navigator) {
        try {
          swRegistration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
          if (firebase.messaging.isSupported()) messaging = firebase.messaging();
        } catch (e) { console.error("SW Register Error:", e); }
      }
      await fetchEmployees();
      if (currentUser) showMainApp();
    });

    function toggleLanguage() {
      currentLang = currentLang === "zh" ? "vi" : "zh";
      localStorage.setItem("app_lang", currentLang);
      applyLanguage();
      if (currentUser) loadTasks();
    }

    function applyLanguage() {
      const t = i18n[currentLang];
      document.getElementById("txt-app-title").innerText = t.appTitle;
      document.getElementById("txt-tasks-title").innerHTML = `<i class="fa-solid fa-list-check text-blue-600"></i> <span>${t.tasks}</span>`;
      document.getElementById("txt-forms-title").innerHTML = `<i class="fa-solid fa-bolt-lightning text-amber-500"></i> <span>${t.forms}</span>`;
      document.getElementById("txt-search-title").innerHTML = `<i class="fa-solid fa-magnifying-glass text-blue-600"></i> <span>${t.search}</span>`;
      document.getElementById("btn-cleaning").innerText = t.cleaning;
      document.getElementById("btn-sewage").innerText = t.sewage;
      document.getElementById("btn-assembly").innerText = t.assembly;
      document.getElementById("btn-inventory").innerText = t.inventory;
      document.getElementById("txt-nav-tasks").innerText = t.navTasks;
      document.getElementById("txt-nav-forms").innerText = t.navForms;
      document.getElementById("txt-nav-search").innerText = t.navSearch;
      document.getElementById("lang-btn").innerHTML = currentLang === "zh" ? `<i class="fa-solid fa-earth-americas text-[11px]"></i> <span>Tiếng Việt</span>` : `<i class="fa-solid fa-earth-americas text-[11px]"></i> <span>繁體中文</span>`;
    }

    async function fetchEmployees() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getEmployees`);
        const json = await res.json();
        if (json.status === "success") employeeList = json.data;
      } catch (err) { console.error("Fetch employees failed", err); }
    }

    async function loginWithGoogle() {
      const errBox = document.getElementById("login-error");
      errBox.classList.add("hidden");
      const provider = new firebase.auth.GoogleAuthProvider();

      try {
        const result = await auth.signInWithPopup(provider);
        const email = result.user.email.toLowerCase().trim();

        if (employeeList.length === 0) await fetchEmployees();

        const matched = employeeList.find(e => (e["電郵Email"] || "").toLowerCase().trim() === email);

        if (!matched) {
          errBox.innerText = `登入拒絕：帳號 (${email}) 未登記在員工名冊中。`;
          errBox.classList.remove("hidden");
          auth.signOut();
          return;
        }

        currentUser = matched;
        localStorage.setItem("app_user", JSON.stringify(currentUser));
        showMainApp();
      } catch (err) {
        errBox.innerText = "登入錯誤：" + err.message;
        errBox.classList.remove("hidden");
      }
    }

    function showMainApp() {
      document.getElementById("view-login").classList.add("hidden");
      document.getElementById("main-content").classList.remove("hidden");
      document.getElementById("bottom-nav").classList.remove("hidden");

      const name = (currentLang === "vi" && currentUser["員工姓名(越)"]) ? currentUser["員工姓名(越)"] : currentUser["員工姓名"];
      document.getElementById("user-display").innerHTML = `
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>${currentUser["員工編號Employee_ID"]} ${name}</span>
        <span class="text-slate-500">(${currentUser["職務"]})</span>
      `;

      if (currentUser["職務"] === "主管" || currentUser["員工編號Employee_ID"] === "J001") {
        document.getElementById("manager-create-box").classList.remove("hidden");
      }

      if (currentUser["FCM_Token"]) {
        document.getElementById("push-notice-banner").classList.add("hidden");
      }

      loadTasks();
    }

    function logout() {
      if (confirm("確定要登出系統嗎？")) {
        auth.signOut();
        localStorage.removeItem("app_user");
        currentUser = null;
        location.reload();
      }
    }

    async function requestPushPermissionManually() {
      if (!messaging || !swRegistration) return alert("手機環境不支援推播通知。");
      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swRegistration });
          if (token) {
            document.getElementById("push-notice-banner").classList.add("hidden");
            await fetch(GAS_API_URL, {
              method: "POST",
              body: JSON.stringify({ action: "updateToken", empId: currentUser["員工編號Employee_ID"], token: token })
            });
            alert("推播通知已啟用！");
          }
        }
      } catch (err) { alert("啟用失敗: " + err.message); }
    }

    function switchTab(tab) {
      ["tasks", "forms", "search"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add("hidden");
        document.getElementById(`nav-${t}`).className = "flex flex-col items-center text-slate-400 font-medium text-[11px] py-1 transition";
      });
      document.getElementById(`tab-${tab}`).classList.remove("hidden");
      document.getElementById(`nav-${tab}`).className = "flex flex-col items-center text-blue-600 font-bold text-[11px] py-1 transition";
    }

    async function loadTasks() {
      const container = document.getElementById("tasks-container");
      container.innerHTML = `
        <div class="text-center py-12 text-slate-400 text-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-lg mb-2 text-blue-500"></i>
          <div>載入最新工單中...</div>
        </div>
      `;

      try {
        const isMgr = currentUser["職務"] === "主管" || currentUser["員工編號Employee_ID"] === "J001";
        const res = await fetch(`${GAS_API_URL}?action=getTasks&empId=${currentUser["員工編號Employee_ID"]}&isManager=${isMgr}`);
        const json = await res.json();

        if (json.status === "success" && json.data.length > 0) {
          container.innerHTML = "";
          let total = json.data.length, pending = 0, completed = 0;

          json.data.forEach(t => {
            if (t["工作狀態"] === "已完成") completed++;
            else pending++;

            const isVi = currentLang === "vi";
            const taskContent = isVi && t["工作內容(越)"] ? t["工作內容(越)"] : t["工作內容(中)"];
            
            let statusBadge = "";

    async function processImages(fileInputId) {
      const input = document.getElementById(fileInputId);
      if (!input || !input.files || input.files.length === 0) return [];
      const base64List = [];
      for (let i = 0; i < Math.min(input.files.length, 3); i++) {
        const file = input.files[i];
        const b64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
        base64List.push(b64);
      }
      return base64List;
    }

    async function submitCurrentForm() {
      const btn = document.getElementById("btn-submit-form");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 上傳中...`;
      btn.disabled = true;

      try {
        const images = await processImages("f-photos");
        let payload = { action: "", empId: currentUser["員工編號Employee_ID"], images: images };

        if (currentActiveForm === "cleaning") {
          payload.action = "submitCleaning";
          payload.model = document.getElementById("f-model").value;
          payload.qty = document.getElementById("f-qty").value;
          payload.note = document.getElementById("f-note").value;
        } else if (currentActiveForm === "sewage") {
          payload.action = "submitSewage";
          payload.opType = document.getElementById("f-optype").value;
          payload.equipment = document.getElementById("f-equip").value;
          payload.desc = document.getElementById("f-desc").value;
        } else if (currentActiveForm === "assembly") {
          payload.action = "submitAssembly";
          payload.model = document.getElementById("f-model").value;
          payload.warrantyNo = document.getElementById("f-warranty").value;
          payload.customer = document.getElementById("f-cust").value;
          payload.vent = document.getElementById("f-vent").value;
          payload.voltage = document.getElementById("f-volt").value;
        } else if (currentActiveForm === "inventory") {
          payload.action = "submitInventory";
          payload.actionType = document.getElementById("f-inv-type").value;
          payload.barcode = document.getElementById("f-barcode").value;
          payload.modelName = document.getElementById("f-barcode").value;
          payload.qty = document.getElementById("f-qty").value;
          payload.location = document.getElementById("f-loc").value;
        } else if (currentActiveForm === "createtask") {
          payload.action = "createTask";
          payload.assignerId = currentUser["員工編號Employee_ID"];
          payload.assigneeId = document.getElementById("f-assignee").value;
          payload.department = document.getElementById("f-dept").value;
          payload.taskZh = document.getElementById("f-taskzh").value;
          payload.taskVi = document.getElementById("f-taskvi").value;
          payload.deadline = document.getElementById("f-deadline").value;
        }

        const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        const json = await res.json();
        if (json.status === "success") {
          closeFormModal();
          switchTab("tasks");
          loadTasks();
        } else {
          alert("送出失敗：" + json.message);
        }
      } catch (err) {
        alert("連線異常：" + err);
      } finally {
        btn.innerText = "確認送出";
        btn.disabled = false;
      }
    }

    function openWorkerReportModal(taskId) {
      const rep = prompt("請輸入回報說明：", "工作已完成");
      if (rep !== null) submitTaskStatus(taskId, rep, null);
    }

    function reviewTask(taskId, status) {
      if (confirm(`確認將此工單設為【${status}】？`)) {
        submitTaskStatus(taskId, null, status);
      }
    }

    async function submitTaskStatus(taskId, report, approval) {
      const payload = { action: "updateTaskStatus", taskId: taskId };
      if (report) payload.workerReport = report;
      if (approval) payload.managerApproval = approval;

      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
      const json = await res.json();
      if (json.status === "success") {
        loadTasks();
      } else {
        alert("更新失敗：" + json.message);
      }
    }

    async function searchMaintenance() {
      const custId = document.getElementById("search-cust-id").value.trim();
      const resultsDiv = document.getElementById("search-results");
      if (!custId) return alert("請輸入客戶編號");

      resultsDiv.innerHTML = `<div class="text-center py-6 text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 查詢中...</div>`;
      try {
        const res = await fetch(`${GAS_API_URL}?action=searchMaintenance&customerId=${encodeURIComponent(custId)}`);
        const json = await res.json();

        if (json.status === "success" && json.data.length > 0) {
          resultsDiv.innerHTML = "";
          json.data.forEach((r, idx) => {
            let img = "";
            if (r.photo1 && r.photo1.startsWith("http")) {
              img = `<img src="${r.photo1}" class="w-full h-32 object-cover rounded-xl mt-2 cursor-pointer" onclick="openLightbox('${r.photo1}')">`;
            }

            resultsDiv.innerHTML += `
              <div class="border border-slate-200/80 rounded-2xl p-3.5 bg-slate-50 text-xs space-y-1.5 card-shadow">
                <div class="flex justify-between font-bold text-slate-800">
                  <span class="text-blue-700 font-extrabold">#${idx + 1} 📅 ${r.date}</span>
                  <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md font-mono">${r.customerId}</span>
                </div>
                <div class="text-slate-600">👤 執行人員：${r.driver || "-"} / ${r.assistant || "-"}</div>
                <div class="text-slate-600">🔧 保養項目：${r.record || "例行保養"} (${r.model || "-"} ${r.qty || 0}組)</div>
                ${r.note ? `<div class="text-slate-400 bg-white p-2 rounded-lg border border-slate-200/60 mt-1">📝 ${r.note}</div>` : ""}
                ${img}
              </div>
            `;
          });
        } else {
          resultsDiv.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">查無客戶編號【${custId}】的保養紀錄</div>`;
        }
      } catch (e) {
        resultsDiv.innerHTML = `<div class="text-center py-6 text-xs text-rose-500">查詢失敗</div>`;
      }
    }
  </script>
